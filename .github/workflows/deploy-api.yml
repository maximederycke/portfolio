name: Deploy API

on:
  push:
    branches: [main]
    paths: [api/**, .github/workflows/deploy-api.yml]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; le suivant attend au lieu d'interrompre celui en cours
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    # Version figée : ubuntu-latest bascule sur Ubuntu 26 à partir du 19/10/2026
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Même version majeure que le runtime de la fonction (runtime=node22 ci-dessous)
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Version de pnpm lue dans le champ packageManager de api/package.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json

      - name: Build
        working-directory: api
        run: pnpm install --frozen-lockfile && pnpm run build

      # Action officielle (installe seulement, sans args) plutôt que get.sh pipé dans sudo sh ;
      # version figée : par défaut elle prendrait la dernière publiée
      - uses: scaleway/action-scw@v0.0.3
        with:
          version: v2.63.0

      - name: Deploy
        working-directory: api
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORG_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_NAMESPACE_ID: ${{ secrets.SCW_NAMESPACE_ID }}
        run: |
          zip -j function.zip dist/contact.js
          scw function deploy name=contact-form-handler runtime=node22 zip-file=function.zip namespace-id="$SCW_NAMESPACE_ID" region=fr-par
