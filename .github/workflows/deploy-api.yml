name: Deploy API

on:
  push:
    branches: [main]
    paths: [api/**, .github/workflows/deploy-api.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build
        working-directory: api
        run: pnpm install --frozen-lockfile && pnpm run build

      # Binaire épinglé et vérifié : get.sh échoue en silence depuis la v2.63.0 (son grep attrape aussi les .deb/.rpm)
      - name: Install Scaleway CLI
        env:
          SCW_CLI_VERSION: 2.63.0
        run: |
          file="scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          base="https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL "$base/SHA256SUMS" | grep " ${file}\$" | sha256sum -c -
          sudo install -m 755 "$file" /usr/local/bin/scw
          scw version

      - name: Deploy
        working-directory: api
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORG_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          zip -j function.zip dist/contact.js
          scw function deploy name=contact-form-handler runtime=node22 zip-file=function.zip namespace-id=${{ secrets.SCW_NAMESPACE_ID }} region=fr-par