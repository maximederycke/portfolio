name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - astro.config.*
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

# Deux rclone sync en parallèle pourraient s'entremêler : le déploiement suivant attend la fin du précédent
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    # Version figée : ubuntu-latest bascule sur Ubuntu 26 à partir du 19/10/2026
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Même version majeure qu'en local
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Version de pnpm lue dans le champ packageManager de package.json
      - uses: pnpm/action-setup@v6

      - name: Build
        run: pnpm install --frozen-lockfile && pnpm run build
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}

      # Binaire épinglé et vérifié, comme la CLI Scaleway côté API, plutôt que install.sh pipé dans sudo bash
      - name: Install rclone
        env:
          RCLONE_VERSION: 1.75.1
        run: |
          file="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          base="https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL "$base/SHA256SUMS" | grep " ${file}\$" | sha256sum -c -
          unzip -q "$file"
          sudo install -m 755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Deploy to Scaleway Object Storage
        env:
          RCLONE_CONFIG_SCW_TYPE: s3
          RCLONE_CONFIG_SCW_PROVIDER: Scaleway
          RCLONE_CONFIG_SCW_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          RCLONE_CONFIG_SCW_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          RCLONE_CONFIG_SCW_REGION: fr-par
          RCLONE_CONFIG_SCW_ENDPOINT: s3.fr-par.scw.cloud
          RCLONE_CONFIG_SCW_ACL: public-read
        # --ignore-times réenvoie tout (< 1 Mo) pour que chaque objet porte son Cache-Control.
        # Ordre : assets d'abord, puis le HTML qui les référence, puis suppression des fichiers obsolètes.
        run: |
          rclone copy dist/_astro scw:maximederycke.dev/_astro --ignore-times \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copy dist/ scw:maximederycke.dev --ignore-times --exclude "_astro/**" \
            --header-upload "Cache-Control: public, max-age=0, must-revalidate"
          rclone sync dist/ scw:maximederycke.dev

      # Le HTML est gardé 1 mois en cache par Cloudflare (Cache Rule) : on vide le cache à chaque déploiement
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
